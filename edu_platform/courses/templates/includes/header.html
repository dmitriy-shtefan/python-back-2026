<header>

    {% if request.user.is_authenticated %}
        <span>Користувач: {{ request.user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Вийти</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Увійти</a>
    {% endif %}

</header>
