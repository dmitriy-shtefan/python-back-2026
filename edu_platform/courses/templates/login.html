{% extends "base.html" %}

{% block title %}Освітня Платформа - Авторизація{% endblock %}

{% block content %}
    <h1>Вхід</h1>

    {% if form.errors %}
        <p>Неправильний логін або пароль.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>
{% endblock %}
