<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
    <h2>{{ username|title }}</h2>
    <p>Баланс: {{ balance|floatformat:2 }}</p>
    <p>Дата: {{ joined|date:"d.m.Y" }}</p>
    <p>{{ bio|truncatewords:5 }}</p>
    <!-- one line django comment -->
    {# django template comment #}
    <!-- multi-line django comment -->
    {% comment %}
        django template comments
    {% endcomment %}
</body>
</html>
